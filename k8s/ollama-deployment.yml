apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-deployment
  namespace: bankapp
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
        - name: OLLAMA_MODEL
          value: "tinyllama"
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve &
            sleep 3
            echo "Pulling model ${OLLAMA_MODEL}..."
            ollama pull ${OLLAMA_MODEL}
            echo "Model ready!"
            wait
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
        resources:
          limits:
            cpu: 1
            memory: 2Gi
          requests:
            cpu: 1Gi
            memory: 512Mi
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-pvc
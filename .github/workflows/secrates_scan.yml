name: Secrates Scan

on: 
  workflow_call:

jobs:
    secrates_scan:
      runs-on: ubuntu-latest
      steps:

        - name: Check the code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

          
        - name: Run Gitleaks
          uses: gitleaks/gitleaks-action@v2.3.9
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Secrates Scan

on: 
  workflow_dispatch:

jobs:
    secrates_scan:
      runs-on: ubuntu-latest
      steps:

        - name: Check the code
          uses: actions/checkout@v5

          
        - name: Run Gitleaks
          uses: gitleaks/gitleaks-action@v2
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
